<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smooth Manual Scroll Slides</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow-x: hidden;
      }
      body {
        font-family: sans-serif;
      }
      .top-section,
      .bottom-section {
        height: 100vh;
        background: #ccc;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
      }
      .bottom-section {
        background: #f1f1f1;
      }
      .traceability {
        position: relative;
        height: 100vh;
        overflow: hidden;
      }
      .image-wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 5vw;
        pointer-events: none;
        user-select: none;
        transform: scale(1);
        will-change: transform;
        transition: all 0.3s ease;
      }
      .image-wrapper:nth-child(1) {
        background: #1abc9c;
        color: white;
      }
      .image-wrapper:nth-child(2) {
        background: #3498db;
        color: white;
      }
      .image-wrapper:nth-child(3) {
        background: #9b59b6;
        color: white;
      }
      .image-wrapper:nth-child(4) {
        background: #e74c3c;
        color: white;
      }
    </style>
  </head>
  <body>
    <section class="top-section">Top Section</section>

    <section class="traceability">
      <div class="image-wrapper">Slide 1</div>
      <div class="image-wrapper">Slide 2</div>
      <div class="image-wrapper">Slide 3</div>
      <div class="image-wrapper">Slide 4</div>
    </section>

    <section class="bottom-section">Bottom Section</section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Observer.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger, Observer);

      const slides = gsap.utils.toArray(".image-wrapper");
      let currentIndex = 0;
      let isAnimating = false;
      let observer = null;

      // Set initial state
      gsap.set(slides, { scale: 0.5 });
      gsap.set(slides[0], { scale: 1 });

      ScrollTrigger.create({
        trigger: ".traceability",
        start: "top top",
        end: () => `+=${slides.length * window.innerHeight}`,
        pin: true,
        pinSpacing: true,
        anticipatePin: 1,
        invalidateOnRefresh: true,
        onEnter: enableObserver,
        onEnterBack: enableObserver,
        onLeave: disableObserver,
        onLeaveBack: disableObserver,
      });

      function throttle(func, delay) {
        let lastCall = 0;
        return function (...args) {
          const now = Date.now();
          if (now - lastCall >= delay) {
            lastCall = now;
            func(...args);
          }
        };
      }

      function goToSlide(index) {
        if (
          isAnimating ||
          index === currentIndex ||
          index < 0 ||
          index >= slides.length
        )
          return;
        isAnimating = true;

        // Hide current
        gsap.to(slides[currentIndex], {
          scale: 0.5,
          duration: 0.5,
          ease: "power2.inOut",
        });

        // Show new
        gsap.to(slides[index], {
          scale: 1,
          duration: 0.5,
          ease: "power2.inOut",
          onComplete: () => {
            currentIndex = index;
            setTimeout(() => (isAnimating = false), 250);
          },
        });
      }

      function enableObserver() {
        if (observer) return;
        observer = Observer.create({
          target: window,
          type: "wheel,touch,pointer",
          preventDefault: true,
          tolerance: 10,
          onDown: throttle(() => goToSlide(currentIndex + 1), 400),
          onUp: throttle(() => goToSlide(currentIndex - 1), 400),
        });
      }

      function disableObserver() {
        if (observer) {
          observer.kill();
          observer = null;
        }
      }
    </script>
  </body>
</html>
