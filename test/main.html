<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blur Gradient Header</title>
  <style>
    body {
      margin: 0;
      height: 2000px;
      background: #111;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background: transparent;
      z-index: 10;
      pointer-events: none; /* so content below can be interacted with if needed */
    }

    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(255,255,255,0) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .content {
      padding-top: 100px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <header></header>

  <div class="content">
    <h1>Static Blur Gradient Header</h1>
    <p>Header stays fixed and blurred from top to bottom like a gradient.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed ac erat vitae elit tincidunt suscipit...</p>
    <!-- Add more content -->
  </div>

</body>
</html>
