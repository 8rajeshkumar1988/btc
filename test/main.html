<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GSAP Slide Scroll Reverse</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #000;
      height: 100%;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 10;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 4rem;
      color: white;
      opacity: 0;
      transform: scale(0);
      z-index: 0;
    }

   
    .scroll-trigger {
      height: 100vh;
    }
  </style>
</head>
<body>
  <section style="height: 100vh;z-index: 9999;background-color: #000;position: relative;"></section>
  <div class="container">
    <div class="slide">Slide 1</div>
    <div class="slide">Slide 2</div>
    <div class="slide">Slide 3</div>
    <div class="slide">Slide 4</div>
  </div>

  <!-- Scroll triggers -->
  <div class="scroll-trigger"></div>
  <div class="scroll-trigger"></div>
  <div class="scroll-trigger"></div>
  <div class="scroll-trigger"></div>
    <section style="height: 100vh;z-index: 9999;background-color: #000;position: relative;"></section>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const slides = document.querySelectorAll(".slide");
    const triggers = document.querySelectorAll(".scroll-trigger");

    // Hide all slides initially
    gsap.set(slides, { opacity: 0, scale: 0 });

    triggers.forEach((trigger, index) => {
      ScrollTrigger.create({
        trigger: trigger,
        start: "top center",
        end: "bottom center",
        onEnter: () => activateSlide(index),
        onEnterBack: () => activateSlide(index),
      });
    });

    function activateSlide(index) {
      slides.forEach((slide, i) => {
        if (i === index) {
          gsap.to(slide, {
            scale: 1,
            opacity: 1,
            duration: 0.6,
            ease: "power2.out",
            zIndex: 1
          });
        } else {
          gsap.to(slide, {
            scale: 0,
            opacity: 0,
            duration: 0.4,
            ease: "power2.in",
            zIndex: 0
          });
        }
      });
    }

    activateSlide(0);
  </script>

</body>
</html>
