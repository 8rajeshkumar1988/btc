<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Arrow Stroke</title>
  <style>
    body {
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    svg {
      width: 100px;
      height: 100px;
    }

    .arrow-path {
      fill: none;
      stroke: #000;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      animation: drawArrow 2s ease forwards;
    }

    @keyframes drawArrow {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>



</body>
</html>
